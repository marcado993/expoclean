<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 680 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Conexión del ESP32, el relé y el motor con fuentes separadas</title>
<defs>
<marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="flecha-ambar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="400" fill="#FFFFFF"/>

<rect x="40" y="36" width="100" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="90" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Powerbank</text>
<text x="90" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">USB 5 V</text>
<line x1="140" y1="58" x2="174" y2="58" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#flecha-verde)"/>

<rect x="176" y="40" width="130" height="132" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="241" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ESP32</text>
<text x="294" y="96" text-anchor="end" dominant-baseline="central" font-size="14" fill="#085041">GPIO 22</text>
<text x="294" y="124" text-anchor="end" dominant-baseline="central" font-size="14" fill="#085041">5V / VIN</text>
<text x="294" y="152" text-anchor="end" dominant-baseline="central" font-size="14" fill="#085041">GND</text>

<line x1="306" y1="96" x2="384" y2="96" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#flecha-verde)"/>
<line x1="306" y1="124" x2="384" y2="124" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#flecha-verde)"/>
<line x1="306" y1="152" x2="384" y2="152" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#flecha-verde)"/>

<rect x="386" y="40" width="140" height="256" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="456" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Módulo de relé</text>
<text x="398" y="78" dominant-baseline="central" font-size="12" fill="#5F5E5A">Lado de señal</text>
<text x="398" y="96" dominant-baseline="central" font-size="14" fill="#444441">IN</text>
<text x="398" y="124" dominant-baseline="central" font-size="14" fill="#444441">VCC</text>
<text x="398" y="152" dominant-baseline="central" font-size="14" fill="#444441">GND</text>
<line x1="392" y1="182" x2="520" y2="182" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="398" y="200" dominant-baseline="central" font-size="12" fill="#5F5E5A">Lado de potencia</text>
<text x="398" y="230" dominant-baseline="central" font-size="14" fill="#444441">COM</text>
<text x="514" y="258" text-anchor="end" dominant-baseline="central" font-size="14" fill="#444441">NO</text>

<rect x="40" y="204" width="160" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="120" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Fuente del motor</text>
<text x="120" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">12 V, aparte</text>
<line x1="200" y1="230" x2="384" y2="230" stroke="#BA7517" stroke-width="1.5" marker-end="url(#flecha-ambar)"/>
<line x1="526" y1="258" x2="554" y2="258" stroke="#BA7517" stroke-width="1.5" marker-end="url(#flecha-ambar)"/>

<rect x="556" y="224" width="90" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="601" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Bomba</text>
<text x="601" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">diodo después</text>

<path d="M601 292 V324 H120 V258" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#flecha-ambar)"/>
<text x="360" y="314" text-anchor="middle" font-size="12" fill="#5F5E5A">negativo (−), sin pasar por el relé</text>

<rect x="40" y="360" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="62" y="368" dominant-baseline="central" font-size="12" fill="#444441">Señal y alimentación</text>
<rect x="260" y="360" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="282" y="368" dominant-baseline="central" font-size="12" fill="#444441">Potencia del motor</text>
</svg>
